<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="60%">
      <stop offset="0" stop-color="#24405c"/>
      <stop offset="0.55" stop-color="#101c2b"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.35" stop-color="#f2c14e"/>
      <stop offset="0.7" stop-color="#b4741a"/>
      <stop offset="1" stop-color="#f6d27a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffc94a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="1" stop-color="#d9c79a"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="236" fill="url(#bg)"/>

  <g clip-path="url(#disc)">
    <!-- faisceau de la balise -->
    <polygon points="226,300 286,300 372,10 140,10" fill="url(#beam)" filter="url(#soft)"/>
    <polygon points="244,300 268,300 300,10 212,10" fill="#fff6cf" opacity="0.55" filter="url(#soft)"/>
    <ellipse cx="256" cy="272" rx="170" ry="150" fill="url(#glow)"/>
    <!-- sol -->
    <ellipse cx="256" cy="430" rx="150" ry="26" fill="#000" opacity="0.45"/>
    <ellipse cx="256" cy="426" rx="118" ry="16" fill="none" stroke="#ffcf5a" stroke-width="5" opacity="0.8"/>
  </g>

  <!-- crâne -->
  <g filter="url(#shadow)">
    <path d="M150 250 C150 160 198 104 256 104 C314 104 362 160 362 250
             C362 292 344 320 322 334 L322 378 C322 394 311 404 296 404
             L216 404 C201 404 190 394 190 378 L190 334 C168 320 150 292 150 250 Z"
          fill="url(#bone)" stroke="#2b1c0b" stroke-width="9" stroke-linejoin="round"/>
    <path d="M176 262 C176 232 196 222 220 228 C240 233 246 252 240 274 C235 293 216 300 198 294 C184 289 176 278 176 262 Z" fill="#17100a"/>
    <path d="M336 262 C336 232 316 222 292 228 C272 233 266 252 272 274 C277 293 296 300 314 294 C328 289 336 278 336 262 Z" fill="#17100a"/>
    <path d="M256 292 L238 332 Q256 322 274 332 Z" fill="#17100a"/>
    <g stroke="#2b1c0b" stroke-width="8" stroke-linecap="round">
      <line x1="224" y1="356" x2="224" y2="400"/>
      <line x1="256" y1="352" x2="256" y2="400"/>
      <line x1="288" y1="356" x2="288" y2="400"/>
    </g>
    <path d="M178 176 C196 140 228 124 256 122" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- anneau -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1a1005" stroke-width="30"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="20"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#000" stroke-width="3" opacity="0.6"/>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Syntax check every file
        run: luac5.3 -p $(git ls-files '*.lua')
      - name: Locales have the same keys
        run: python3 tests/check_locales.py
